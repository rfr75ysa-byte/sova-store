
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061629">
  <title>سلة المشتريات | SOVA</title>

  <link rel="icon" type="image/svg+xml" href="/static/images/sova-icon.svg">
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    :root {
      --bg: #061629;
      --panel: #0a2038;
      --blue: #35b8ff;
      --cyan: #8cddff;
      --text: #f5f8ff;
      --muted: #91a8bf;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
    }

    .header .logo {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
    }

    .header .logo-image {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      width: 58px !important;
      height: 58px !important;
      min-width: 58px;
      object-fit: contain;
    }

    .cart-page {
      max-width: 1000px;
      margin: auto;
      padding: 55px 22px 80px;
      min-height: 70vh;
    }

    .cart-page h1 {
      font-size: clamp(32px, 5vw, 48px);
      margin-bottom: 8px;
    }

    .cart-subtitle {
      color: var(--muted);
      margin-bottom: 35px;
      line-height: 1.8;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 15px;
      background: linear-gradient(145deg, #102c47, #081727);
      border: 1px solid rgba(154, 204, 238, .16);
    }

    .cart-item img {
      flex-shrink: 0;
      object-fit: contain;
    }

    .cart-item h3 {
      margin: 0 0 8px;
    }

    .cart-item p {
      color: #a7bdd0;
      font-size: 13px;
      line-height: 1.8;
    }

    .cart-item button {
      margin: 4px;
      padding: 7px 12px;
      border: 1px solid #35b8ff66;
      border-radius: 7px;
      background: transparent;
      color: var(--cyan);
      cursor: pointer;
    }

    .cart-item button:hover {
      background: var(--blue);
      color: var(--bg);
    }

    .cart-summary {
      margin-top: 28px;
      padding: 25px;
      border-radius: 16px;
      border: 1px solid rgba(154, 204, 238, .2);
      background: var(--panel);
    }

    .cart-summary h2 {
      margin: 0 0 20px;
    }

    #cart-total {
      color: var(--cyan);
    }

    .cart-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .cart-buttons button,
    .cart-buttons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 9px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .checkout-button {
      background: var(--blue);
      color: var(--bg);
      border: 0;
    }

    .continue-button {
      border: 1px solid #35b8ff66;
      background: transparent;
      color: var(--cyan);
    }

    .empty-cart {
      padding: 30px 20px;
      text-align: center;
      border: 1px solid rgba(154, 204, 238, .16);
      border-radius: 15px;
      background: var(--panel);
      color: var(--muted);
      line-height: 2;
    }

    @media (max-width: 650px) {
      .header {
        gap: 12px;
      }

      .header .logo-image {
        width: 50px !important;
        height: 50px !important;
        min-width: 50px;
      }

      .cart-page {
        padding: 35px 15px 55px;
      }

      .cart-item {
        gap: 10px;
        padding: 10px;
      }

      .cart-item img {
        width: 65px !important;
        height: 80px !important;
      }

      .cart-item button {
        margin: 3px;
        padding: 6px 9px;
      }

      .cart-buttons {
        flex-direction: column;
      }

      .cart-buttons button,
      .cart-buttons a {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a class="logo" href="/index.html" aria-label="SOVA - الرئيسية">
      <img
        class="logo-image"
        src="/static/images/sova-icon.svg"
        alt="SOVA"
        onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','<span style=&quot;color:#8cddff;font-weight:bold;font-size:25px&quot;>SOVA®</span>')"
      >
    </a>

    <nav>
      <a href="/index.html">الرئيسية</a>
      <a href="/index.html#about">من نحن</a>
      <a href="/index.html#collection">عطورنا</a>
      <a href="/cart.html">السلة 🛒 (<span data-cart-count>0</span>)</a>
    </nav>
  </header>

  <main class="cart-page">
    <p class="eyebrow">YOUR SOVA SELECTION</p>
    <h1>سلة المشتريات</h1>
    <p class="cart-subtitle">
      اختار عطرك المفضل وخلي الباقي علينا 💙
    </p>

    <div id="cart-items">
      <p>جاري تحميل السلة...</p>
    </div>

    <section class="cart-summary">
      <h2>ملخص الطلب</h2>

      <p>
        المجموع الكلي:
        <strong id="cart-total">0 د.ع</strong>
      </p>

      <p style="color:#91a8bf;font-size:12px;line-height:1.9">
        أجور التوصيل، إن وجدت، يتم تأكيدها عند التواصل.
      </p>

      <div class="cart-buttons">
        <button type="button" class="checkout-button" data-checkout>
          أكمل الطلب عبر واتساب
        </button>

        <a href="/index.html#collection" class="continue-button">
          متابعة التسوق
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p>© SOVA — الفخامة تبدأ من التفاصيل</p>
    <a href="https://wa.me/9647806364447">تواصل ويانا</a>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
